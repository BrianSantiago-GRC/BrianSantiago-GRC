name: Test security automation

on:
  push:
    paths:
      - "security-automation/**"
      - ".github/workflows/test-security-automation.yml"
  pull_request:
    paths:
      - "security-automation/**"
      - ".github/workflows/test-security-automation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        working-directory: security-automation
        run: python -m unittest discover -s tests -v
