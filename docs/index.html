  <style>
    :root {
      --ink: #071117;
      --dark: #061014;
      --dark-2: #0b171d;
      --dark-3: #101f26;
      --paper: #ffffff;
      --soft: #f6f8fa;
      --line: #d9e2e7;
      --line-dark: rgba(180, 216, 219, 0.2);
      --text: #17242b;
      --muted: #586d77;
      --teal: #20c7bc;
      --teal-2: #0a8f84;
      --amber: #f2ad22;
      --amber-2: #ffcf5a;
      --blue: #1d5668;
      --max: 1220px;
      --shadow: 0 26px 60px rgba(7, 17, 23, 0.14);
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img,
    svg {
      max-width: 100%;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: absolute;
      top: -60px;
      left: 16px;
      z-index: 99;
      padding: 10px 14px;
      border-radius: 4px;
      background: var(--amber);
      color: var(--ink);
      font-weight: 800;
    }

    .skip-link:focus {
      top: 14px;
    }

    .site-shell {
      min-height: 100vh;
    }

    .hero {
      position: relative;
      color: var(--paper);
      background:
        linear-gradient(90deg, rgba(6, 16, 20, 0.96) 0%, rgba(6, 16, 20, 0.88) 37%, rgba(6, 16, 20, 0.64) 72%, rgba(6, 16, 20, 0.92) 100%),
        radial-gradient(circle at 70% 18%, rgba(32, 199, 188, 0.22), transparent 26%),
        radial-gradient(circle at 52% 52%, rgba(242, 173, 34, 0.12), transparent 28%),
        #061014;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.56;
      background:
        linear-gradient(116deg, transparent 0 38%, rgba(32, 199, 188, 0.18) 38.2%, transparent 38.7%),
        linear-gradient(125deg, transparent 0 49%, rgba(242, 173, 34, 0.17) 49.2%, transparent 49.75%),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 70px 70px,
        linear-gradient(rgba(255,255,255,0.038) 1px, transparent 1px) 0 0 / 70px 70px;
      pointer-events: none;
    }

    .route-map {
      position: absolute;
      inset: 0 0 auto auto;
      width: 68%;
      height: 620px;
      pointer-events: none;
      opacity: 0.92;
    }

    .route-map svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .nav {
      position: relative;
      z-index: 5;
      max-width: var(--max);
      min-height: 78px;
      margin: 0 auto;
      padding: 0 clamp(20px, 4vw, 42px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      border-bottom: 1px solid var(--line-dark);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--paper);
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 2px solid var(--teal);
      border-radius: 3px;
      color: var(--paper);
      font-size: 17px;
      line-height: 1;
      box-shadow: 0 0 24px rgba(32, 199, 188, 0.3);
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(18px, 3vw, 34px);
      font-size: 14px;
      font-weight: 800;
      color: #f1f7f8;
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      max-width: var(--max);
      min-height: 650px;
      margin: 0 auto;
      padding: 70px clamp(20px, 4vw, 42px) 44px;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(420px, 0.9fr);
      gap: clamp(32px, 6vw, 82px);
      align-items: center;
    }

    .kicker {
      margin: 0 0 16px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--paper);
      font-size: clamp(54px, 7vw, 88px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
    }

    .hero-role {
      margin: 0 0 24px;
      color: var(--teal);
      font-size: clamp(23px, 3vw, 32px);
      font-weight: 900;
      line-height: 1.15;
    }

    .hero-role span {
      color: var(--amber);
      display: inline-block;
      margin: 0 10px;
    }

    .hero-copy {
      max-width: 650px;
    }

    .hero-copy p:not(.kicker):not(.hero-role) {
      margin: 0;
      color: #d9e8eb;
      font-size: 17px;
      max-width: 580px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 4px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 900;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      text-decoration: none;
    }

    .btn.primary {
      background: var(--teal);
      color: #031112;
      box-shadow: 0 14px 26px rgba(32, 199, 188, 0.22);
    }

    .btn.outline {
      color: var(--paper);
      border-color: var(--amber);
      background: rgba(6, 16, 20, 0.28);
    }

    .btn.secondary {
      color: var(--paper);
      border-color: rgba(217, 232, 235, 0.48);
      background: rgba(217, 232, 235, 0.08);
    }

    .hero-proof {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 26px;
      border: 1px solid var(--line-dark);
      background: rgba(7, 17, 23, 0.42);
      backdrop-filter: blur(8px);
    }

    .proof-point {
      min-height: 82px;
      padding: 15px 14px 13px;
      border-left: 1px solid var(--line-dark);
    }

    .proof-point:first-child {
      border-left: 0;
    }

    .proof-point strong {
      display: block;
      color: var(--amber);
      font-size: 25px;
      line-height: 1;
      font-weight: 900;
    }

    .proof-point span {
      display: block;
      margin-top: 7px;
      color: #d9e8eb;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
    }

    .hero-traits {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
      margin-top: 54px;
      max-width: 760px;
    }

    .trait {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      align-items: start;
      min-width: 0;
    }

    .trait svg {
      width: 28px;
      height: 28px;
      color: var(--teal);
      stroke-width: 1.8;
    }

    .trait strong {
      display: block;
      color: var(--paper);
      font-size: 13px;
      line-height: 1.25;
    }

    .trait span {
      display: block;
      color: #a9bdc2;
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.35;
    }

    .hero-evidence {
      position: relative;
      min-height: 680px;
    }

    .mile-card,
    .route-card,
    .evidence-table,
    .event-log {
      position: absolute;
      border: 1px solid rgba(180, 216, 219, 0.25);
      border-radius: var(--radius);
      background: rgba(6, 16, 20, 0.72);
      color: #d9e8eb;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .mile-card {
      top: 110px;
      left: 85px;
      width: 110px;
      padding: 16px;
      text-align: center;
    }

    .mile-card span {
      display: block;
      color: #bcd0d5;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .mile-card strong {
      display: block;
      color: var(--amber);
      font-size: 38px;
      line-height: 1;
      margin-top: 4px;
      font-weight: 900;
    }

    .route-card {
      top: 44px;
      right: 0;
      width: 210px;
      padding: 18px;
    }

    .route-card h3,
    .evidence-table h3,
    .event-log h3 {
      margin: 0 0 12px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .route-card ul {
      margin: 0;
      padding: 0;
      display: grid;
      gap: 9px;
      list-style: none;
    }

    .route-card li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: center;
      color: #d9e8eb;
      font-size: 12px;
      font-weight: 800;
    }

    .check-dot {
      width: 15px;
      height: 15px;
      border: 1px solid var(--teal);
      border-radius: 999px;
      position: relative;
    }

    .check-dot::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 2px;
      width: 4px;
      height: 7px;
      border: solid var(--teal);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .evidence-table {
      right: 0;
      top: 230px;
      width: min(100%, 430px);
      padding: 16px;
    }

    .evidence-table table {
      width: 100%;
      border-collapse: collapse;
      color: #d7e5e8;
      font-size: 12px;
    }

    .evidence-table th,
    .evidence-table td {
      padding: 7px 6px;
      border-top: 1px solid rgba(180, 216, 219, 0.15);
      text-align: left;
    }

    .evidence-table th {
      color: #94acb3;
      font-size: 11px;
      font-weight: 800;
    }

    .evidence-table td:nth-child(2) {
      color: var(--paper);
      font-weight: 800;
    }

    .evidence-table td:nth-child(3) {
      color: var(--amber);
      text-align: right;
      font-weight: 900;
    }

    .event-log {
      right: 0;
      top: 498px;
      width: min(100%, 430px);
      padding: 14px 16px;
    }

    .log-line {
      display: grid;
      grid-template-columns: 94px 48px 1fr;
      gap: 8px;
      padding: 4px 0;
      color: #aebfc4;
      font: 12px/1.3 Consolas, "Courier New", monospace;
    }

    .log-line span:nth-child(2) {
      color: var(--teal);
      font-weight: 900;
    }

    .log-line.warning span:nth-child(2),
    .log-line.warning span:nth-child(3) {
      color: var(--amber);
    }

    .role-router {
      color: var(--paper);
      background:
        linear-gradient(90deg, rgba(6,16,20,0.98), rgba(9,28,35,0.94)),
        var(--dark);
      border-top: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
      padding: 30px clamp(20px, 4vw, 42px);
    }

    .role-router-inner {
      max-width: var(--max);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(250px, 0.72fr) minmax(0, 1fr) minmax(230px, 0.54fr);
      gap: 28px;
      align-items: center;
    }

    .role-router h2 {
      margin: 0;
      color: var(--paper);
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .role-router p {
      margin: 8px 0 0;
      color: #cfe1e4;
      font-size: 15px;
    }

    .role-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line-dark);
      background: rgba(255, 255, 255, 0.05);
    }

    .role-tab {
      flex: 1 1 118px;
      min-height: 42px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: #d9e8eb;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
